name: VLC-iOS
options:
  bundleIdPrefix: org.videolan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MobileVLCKit:
    url: https://github.com/MobileVLCKit-SPM/MobileVLCKit-SPM
    from: 3.6.0
targets:
  VLC-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.videolan.vlc-ios
        PRODUCT_NAME: VLC-iOS
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: VLC
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "VLC imports videos and audio from your photo library for playback."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # The framework is selected by both SDK and configuration. Keeping a
        # single selected path prevents a device archive from finding (and
        # embedding) a debug simulator binary first.
        VLC_SHARED_KOTLIN_TARGET[sdk=iphonesimulator*]: iosSimulatorArm64
        VLC_SHARED_KOTLIN_TARGET[sdk=iphoneos*]: iosArm64
        # This KMP project intentionally does not publish an iosX64 framework.
        # Keep generic simulator builds on the Apple-Silicon slice rather than
        # silently attempting to link arm64 objects into an x86_64 target.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        VLC_SHARED_FRAMEWORK_DIRECTORY: $(SRCROOT)/../shared/build/bin/$(VLC_SHARED_KOTLIN_TARGET)/$(VLC_SHARED_BUILD_TYPE)Framework
        VLC_SHARED_FRAMEWORK_PATH: $(VLC_SHARED_FRAMEWORK_DIRECTORY)/VLCShared.framework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(VLC_SHARED_FRAMEWORK_DIRECTORY)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - VLCShared
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ENABLE_BITCODE: NO
      configs:
        Debug:
          VLC_SHARED_BUILD_TYPE: debug
        Release:
          VLC_SHARED_BUILD_TYPE: release
    dependencies:
      - package: MobileVLCKit
        product: MobileVLCKit
      - framework: $(VLC_SHARED_FRAMEWORK_PATH)
        embed: true
        link: true
    preBuildScripts:
      - name: Build VLCShared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROOT="${SRCROOT}/.."
          cd "$ROOT"
          case "${PLATFORM_NAME:-}" in
            iphonesimulator) kotlin_target="iosSimulatorArm64" ;;
            iphoneos) kotlin_target="iosArm64" ;;
            *) echo "Unsupported iOS platform: ${PLATFORM_NAME:-unset}" >&2; exit 1 ;;
          esac
          case "${CONFIGURATION:-}" in
            Debug|Release) ;;
            *) echo "Unsupported configuration: ${CONFIGURATION:-unset}" >&2; exit 1 ;;
          esac
          if [ -x ./gradlew ]; then
            gradle_command=./gradlew
          elif command -v gradle >/dev/null 2>&1; then
            gradle_command=gradle
          else
            echo "Gradle is required to build VLCShared. Install Gradle or add the wrapper." >&2
            exit 1
          fi
          "$gradle_command" ":shared:link${CONFIGURATION}Framework${kotlin_target}" --no-daemon --no-configuration-cache -q
