plugins {
    id 'com.android.application'
}

// Kept at project scope because Android Components callbacks are evaluated
// before the android { } body finishes configuring split outputs.
def abiCodes = ['armeabi-v7a': 5, 'arm64-v8a': 6, 'x86': 7, 'x86_64': 8]

android {
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/armeabi-v7a/libc++_shared.so', 'lib/armeabi/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    packaging {
        resources.excludes.add("META-INF/versions/9/OSGI-INF/MANIFEST.MF")
    }

    dataBinding {
        enabled = true
    }

    flavorDimensions "abi"

    defaultConfig {
        applicationId rootProject.ext.appId
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true

        testInstrumentationRunner "org.videolan.vlc.MultidexTestRunner"
        // The following argument makes the Android Test Orchestrator run its
        // "pm clear" command after each test invocation. This command ensures
        // that the app's state is completely cleared between tests.
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    signingConfigs {
        release {
            /*
            To set this properties, create file gradle.properties with these 3 props.
            e.g.
            keyStoreFile=/home/<username>/.android/debug.keystore
            storealias=androiddebugkey
            storepwd=android
             */
            if (project.hasProperty('keyStoreFile')) {
                storeFile file(project.findProperty('keyStoreFile'))
                keyAlias project.findProperty('storealias')
                if (System.getenv('PASSWORD_KEYSTORE') != null && !System.getenv('PASSWORD_KEYSTORE').isEmpty()) {
                    storePassword = System.getenv('PASSWORD_KEYSTORE')
                    keyPassword = System.getenv('PASSWORD_KEYSTORE')
                } else {
                    storePassword project.findProperty('storepwd')
                    keyPassword project.findProperty('storepwd')
                }
            }
        }
    }
    androidComponents {
        // Project minSdk is 23 (settings.gradle) for DataStore/Compose. vlcBundle keeps a higher floor.
        beforeVariants(selector().withBuildType("vlcBundle")) { variantBuilder ->
            variantBuilder.minSdk = 30
        }

        // The legacy applicationVariants API is unavailable in AGP 9. Configure
        // split-specific outputs through the stable Android Components API.
        onVariants(selector().all()) { variant ->
            variant.outputs.each { output ->
                def abiFilter = output.filters.find {
                    it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
                }
                def abiName = abiFilter?.identifier ?: "all"
                def abiVersionCode = abiCodes.get(abiName, 0)
                if (variant.buildType == "vlcBundle") {
                    abiVersionCode = 9
                }

                output.versionCode.set(10000000 + rootProject.ext.versionCode + abiVersionCode)
                def outputName = "VLC-Android-${rootProject.ext.versionName.replace(" ", "-")}"
                if (variant.buildType == "debug") outputName += "-debug"
                output.outputFileName.set("${outputName}-${abiName}.apk")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        signedRelease {
            initWith release
            signingConfig = signingConfigs.release
            matchingFallbacks = ['release']
        }
        vlcBundle {
            initWith release
            matchingFallbacks = ['release']
        }
        vlcBundleAmazon {
            initWith release
            matchingFallbacks = ['release']
        }
        debug {
            applicationIdSuffix ".debug"
            jniDebuggable true
        }
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }

    sourceSets.release {
        manifest.srcFile 'flavors/release/AndroidManifest.xml'
    }
    sourceSets.signedRelease {
        manifest.srcFile 'flavors/release/AndroidManifest.xml'
    }

    // `com.android.kotlin.multiplatform.library` generates Compose resources
    // outside the normal Android AAR asset pipeline. The legacy app host must
    // therefore expose the generated payload as an asset source explicitly.
    // Keep each app variant tied to the matching shared resource variant.
    sourceSets.debug.assets.srcDir "$rootDir/shared/build/generated/assets/sharedComposeResources"
    sourceSets.dev.assets.srcDir "$rootDir/shared/build/generated/assets/sharedComposeResources"
    sourceSets.release.assets.srcDir "$rootDir/shared/build/generated/assets/sharedComposeResources"
    sourceSets.signedRelease.assets.srcDir "$rootDir/shared/build/generated/assets/sharedComposeResources"
    sourceSets.vlcBundle.assets.srcDir "$rootDir/shared/build/generated/assets/sharedComposeResources"
    sourceSets.vlcBundleAmazon.assets.srcDir "$rootDir/shared/build/generated/assets/sharedComposeResources"

    bundle {
        language {
            enableSplit = false
        }
    }

    splits {
        abi {
            def isReleaseBuild = false
            gradle.startParameter.taskNames.find {
                // Enable split for release builds in different build flavors
                // (assemblePaidRelease, assembleFreeRelease, etc.).
                if (it.toLowerCase() ==~ /assemble.*Release/.toLowerCase()) {
                    isReleaseBuild = true
                    return true // break
                }
                return false // continue
            }
            enable = isReleaseBuild
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
//            universalApk !isReleaseBuild
        }
    }

    lint {
        abortOnError = false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
    namespace = 'org.videolan.mobile.app'
}

// AGP 9 provides Kotlin directly; compiler options now live on its Kotlin DSL.
kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xno-param-assertions')
    }
}

dependencies {
    // Keep the shared UI runtime visible to the app host. Its generated Compose
    // resource assets are wired above because Android-KMP does not publish them
    // through the legacy Android-library asset pipeline.
    implementation project(':shared')
    implementation project(':application:vlc-android')
    implementation project(':application:television')
    implementation project(':application:remote-access-server')
    testImplementation project(':application:television')
    testImplementation project(':application:remote-access-server')

    androidTestImplementation "androidx.test.espresso:espresso-contrib:$rootProject.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$rootProject.espressoVersion"
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.room:room-testing:$rootProject.ext.roomVersion"
    testImplementation "androidx.arch.core:core-testing:$rootProject.ext.archVersion"
    androidTestImplementation "androidx.arch.core:core-testing:$rootProject.ext.archVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.junitExtVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$rootProject.ext.desugarLib"
    androidTestUtil "androidx.test:orchestrator:$rootProject.ext.orchestrator"
    testImplementation "androidx.test:core:$rootProject.ext.testCore"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.kotlinx_version"
    testImplementation "org.mockito:mockito-core:$rootProject.ext.mockito"
    testImplementation "io.mockk:mockk:$rootProject.ext.mockk"
    testImplementation "com.jraska.livedata:testing-ktx:$rootProject.ext.livedataTest"
    testImplementation "org.robolectric:robolectric:$rootProject.ext.robolectric"
    androidTestImplementation "com.android.support:multidex:1.0.3"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.2.0"
    androidTestImplementation "androidx.test:rules:$rootProject.ext.testCore"
    androidTestImplementation 'com.jraska:falcon:2.2.0'
    androidTestImplementation 'tools.fastlane:screengrab:2.1.0'
}

// The source directories above are generated by Compose. Wire their producers
// into every host asset merge so a clean build cannot package an empty shell.
tasks.configureEach {
    if (name in ['mergeDebugAssets', 'mergeDevAssets', 'mergeReleaseAssets', 'mergeSignedReleaseAssets', 'mergeVlcBundleAssets', 'mergeVlcBundleAmazonAssets']) {
        dependsOn ':shared:copyAndroidMainComposeResourcesToAndroidAssets'
    }
}
