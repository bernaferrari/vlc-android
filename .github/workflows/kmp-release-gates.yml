name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: KMP web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify web distribution
        run: ./scripts/verify-web-build.sh --ci

      - name: Upload Web distribution
        uses: actions/upload-artifact@v6
        with:
          name: vlc-web-wasm
          path: webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
