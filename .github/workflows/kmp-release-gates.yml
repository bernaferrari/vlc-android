name: KMP release gates

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'ios/**'
      - 'webApp/**'
      - 'application/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/kmp-release-gates.yml'
  push:
    branches: [master]
    paths:
      - 'shared/**'
      - 'ios/**'
      - 'webApp/**'
      - 'application/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/kmp-release-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-wasm:
    name: Android artifacts and shared/Wasm tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Shared KMP tests and Wasm bundle
        run: gradle :shared:allTests :webApp:wasmJsBrowserProductionWebpack --no-daemon --no-configuration-cache --console=plain
      - name: Assemble unsigned Android artifacts
        run: gradle :application:app:assembleDebug :application:app:assembleRelease --no-daemon --no-configuration-cache --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks
          path: application/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore

  ios-simulator-and-archive:
    name: iOS simulator build and unsigned archive
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify generated Xcode project is current
        working-directory: ios
        run: |
          xcodegen generate
          git -C .. diff --exit-code -- ios/VLC-iOS.xcodeproj/project.pbxproj
      - name: Run shared Kotlin tests, including iOS simulator tests
        run: gradle :shared:allTests --no-daemon --no-configuration-cache --console=plain
      - name: Build simulator host and unsigned device archive
        run: ios/verify.sh all
        env:
          IOS_ARCHIVE_PATH: ${{ runner.temp }}/VLC-iOS.xcarchive
          IOS_SPM_CACHE: ${{ runner.temp }}/ios-spm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-archive
          path: ${{ runner.temp }}/VLC-iOS.xcarchive
          if-no-files-found: ignore
