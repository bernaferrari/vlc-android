<!DOCTYPE html>
<html lang="en" style="background:#121212;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="VLC's shared Compose Multiplatform media-library shell.">
    <meta name="robots" content="index, follow">
    <link rel="author" href="https://github.com/bernaferrari/vlc-android">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VLC">
    <meta property="og:title" content="VLC — Compose Multiplatform media library">
    <meta property="og:description" content="A shared VLC Compose Multiplatform media-library shell.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="VLC — Compose Multiplatform media library">
    <meta name="twitter:description" content="A shared VLC Compose Multiplatform media-library shell.">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "VLC",
            "applicationCategory": "MultimediaApplication",
            "description": "A shared VLC Compose Multiplatform media-library shell.",
            "sameAs": ["https://github.com/bernaferrari/vlc-android"]
        }
    </script>
    <title>VLC — Compose Multiplatform media library</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #121212; }
        #loading {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1rem; color: #e8e8e8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .spinner { width: 2rem; height: 2rem; border: 3px solid #ffffff2a; border-top-color: #ff8800; border-radius: 50%; animation: spin .8s linear infinite; }
        .label { margin: 0; font-size: .95rem; font-weight: 500; letter-spacing: .02em; opacity: .9; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="loading" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <p class="label">Loading VLC…</p>
    <noscript><p class="label">VLC needs JavaScript enabled.</p></noscript>
</div>
<script src="vlc-web.js"></script>
</body>
</html>
