<!DOCTYPE html>
<html lang="en" style="background:#121212;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="VLC's shared Compose Multiplatform media-library shell, running in WebAssembly.">
    <title>VLC Web — Compose Multiplatform demo</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #121212; }
        #loading {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1rem; color: #e8e8e8;
            font: 500 0.95rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .spinner { width: 2rem; height: 2rem; border: 3px solid #ffffff2a; border-top-color: #ff8800; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="loading" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading VLC Web…</p>
</div>
<script src="vlc-web.js"></script>
</body>
</html>
